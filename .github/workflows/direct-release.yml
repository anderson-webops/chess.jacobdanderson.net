name: Validate direct production release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Pin npm
        run: npm install --global npm@12.2.1 --allow-scripts=npm

      - name: Prepare exact tagged direct runtime
        env:
          CI: "true"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          RELEASE_ROOT="$(dirname "$GITHUB_WORKSPACE")" \
          NODE_BIN_DIR="$(dirname "$(command -v node)")" \
          NPM_CONFIG_CACHE="$RUNNER_TEMP/npm-cache" \
          deploy/systemd/prepare-release.sh "$GITHUB_WORKSPACE"

  installer:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false

      - name: Stage the protected disposable-host runtime
        run: |
          npm install --global npm@12.2.1 --allow-scripts=npm
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends nginx
          node_prefix="$(dirname "$(dirname "$(command -v node)")")"
          sudo chown root:root /opt
          sudo chmod 0755 /opt
          sudo install -d -o root -g root -m 0755 /opt/node-24.22.1
          sudo cp -a "$node_prefix/." /opt/node-24.22.1/
          sudo chown -R root:root /opt/node-24.22.1
          sudo chmod -R go-w /opt/node-24.22.1
          printf 'isolated-public-source-fixture\n' | sudo tee /run/chess-source-validation-vm >/dev/null
          sudo chown root:root /run/chess-source-validation-vm
          sudo chmod 0600 /run/chess-source-validation-vm

      - name: Test privileged bootstrap and concurrent cache swapping
        run: sudo python3 -B scripts/test-bootstrap-in-vm.py --disposable-vm

  artifact:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          package-manager-cache: false
      - name: Prepare isolated artifact-test tools
        run: |
          npm install --global npm@12.2.1 --allow-scripts=npm
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bubblewrap apparmor nginx openssl
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile chess-artifact-tests /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/chess-artifact-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/chess-artifact-tests
          fi
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
      - name: Validate native source and the exact production artifact
        env:
          CI: "true"
          SKIP_INSTALL_SIMPLE_GIT_HOOKS: "1"
          NUXT_TELEMETRY_DISABLED: "1"
          PUPPETEER_SKIP_DOWNLOAD: "true"
        run: |
          npm ci --include=optional --strict-allow-scripts
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures
          npm run validate
          npm run test:promotion
          mkdir -p .ai-work/runs/tagged-artifact
          npm run package:runtime -- "$PWD/.ai-work/runs/tagged-artifact"

      - name: Retain accepted Linux ARM64 release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-linux-arm64-direct-release
          path: |
            .ai-work/runs/tagged-artifact/*.tar.gz
            .ai-work/runs/tagged-artifact/SHA256SUMS
            .ai-work/runs/tagged-artifact/runtime-manifest.json
            .ai-work/runs/tagged-artifact/acceptance.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
