name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 26.13.0
  NPM_VERSION: 12.2.1
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Align npm with the repository policy
        run: |
          npm install --global "npm@${NPM_VERSION}" --allow-scripts=npm
          node --version
          npm --version

      - name: Install locked dependencies
        run: |
          printf '/.ai-work/\n' >> "$(git rev-parse --git-path info/exclude)"
          npm ci --include=optional --strict-allow-scripts

      - name: Audit development and production dependencies
        run: |
          npm run audit:all
          npm run audit:prod
          npm run audit:api
          npm audit signatures

      - name: Validate source and deployment output
        run: npm run validate

      - name: Run accessibility smoke checks
        run: npm run a11y

  promotion-arm64:
    name: Validate promotion recovery on Linux ARM64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Prepare isolated promotion-test tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends bubblewrap apparmor
          if test -d /sys/kernel/security/apparmor; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile chess-promotion-tests /usr/bin/bwrap flags=(unconfined) {\n  userns,\n}\n' | sudo tee /etc/apparmor.d/chess-promotion-tests >/dev/null
            sudo apparmor_parser -r /etc/apparmor.d/chess-promotion-tests
          fi

      - name: Test privileged promotion and recovery
        run: bash scripts/test-promotion-recovery.sh
